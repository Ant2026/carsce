{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* ==========================================================
       CONTENEDOR PRINCIPAL
    ========================================================== */

    #modulo_visualizar_personal_registrado {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .contenedor_visualizar_registrado {
        width: 100%;
        max-width: 1100px;
        background: #ffffff;
        padding: 35px;
        border-radius: 12px;
        box-sizing: border-box;

        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }


    /* ==========================================================
       TITULO
    ========================================================== */

    .contenedor_visualizar_registrado h2 {
        text-align: center;
        margin: 0 0 30px;
        font-size: 25px;
    }


    /* ==========================================================
       FORMULARIO DE BÚSQUEDA
    ========================================================== */

    .contenedor_busqueda_personal {
        width: 100%;
        max-width: 650px;
        margin: 0 auto 35px;
        padding: 25px;

        box-sizing: border-box;

        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
    }

    #formulario_busqueda {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    #formulario_busqueda label {
        width: 100%;
        max-width: 450px;
        font-weight: bold;
    }

    .grupo-cedula {
        width: 100%;
        max-width: 450px;

        display: flex;
        gap: 8px;
    }

    .grupo-cedula select {
        width: 75px;
        flex-shrink: 0;
    }

    .grupo-cedula input {
        flex: 1;
    }

    #formulario_busqueda input[type="text"],
    #formulario_busqueda select {
        height: 42px;
        padding: 0 12px;

        border: 1px solid #ccc;
        border-radius: 6px;

        box-sizing: border-box;
        font-size: 15px;
    }


    /* ==========================================================
       BOTÓN BUSCAR
    ========================================================== */

    #formulario_busqueda input[type="submit"] {
        margin-top: 8px;

        padding: 11px 25px;

        border: none;
        border-radius: 6px;

        cursor: pointer;

        font-size: 15px;
        font-weight: bold;
    }


    /* ==========================================================
       FORMULARIO ACTUALIZAR
    ========================================================== */

    .contenedor_actualizar_perfil {
        width: 100%;
        max-width: 950px;
        margin: 0 auto;
    }

    #formulario_actualizar {
        width: 100%;

        display: flex;
        flex-direction: column;

        gap: 10px;
    }


    /* ==========================================================
       DATOS DEL USUARIO
    ========================================================== */

    #formulario_actualizar>label {
        width: 100%;
        max-width: 700px;
        margin: 5px auto 0;

        font-weight: bold;
    }

    #formulario_actualizar>input[type="text"] {
        width: 100%;
        max-width: 700px;
        height: 42px;

        margin: 0 auto 8px;

        padding: 0 12px;

        border: 1px solid #ccc;
        border-radius: 6px;

        box-sizing: border-box;

        background: #f5f5f5;
        font-size: 15px;
    }


    /* ==========================================================
       PERFILES ASIGNADOS
    ========================================================== */

    #contenedor_perfiles_asignado {
        width: 100%;
        margin-top: 25px;

        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }


    /* ==========================================================
       TARJETA DE PERFIL ASIGNADO
    ========================================================== */

    .perfil_asignado {
        width: 100%;

        padding: 20px;

        border: 1px solid #dcdcdc;
        border-radius: 10px;

        box-sizing: border-box;

        background: #fafafa;

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .perfil_asignado .campo_perfil {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .perfil_asignado .campo_perfil:first-child {
        grid-column: 1 / -1;
    }

    .perfil_asignado label,
    .perfil_disponible label {
        font-size: 13px;
        font-weight: bold;
    }

    .perfil_asignado input,
    .perfil_disponible input {
        width: 100%;
        height: 40px;

        padding: 0 10px;

        border: 1px solid #ccc;
        border-radius: 6px;

        box-sizing: border-box;

        background: #eeeeee;

        font-size: 14px;
    }


    /* ==========================================================
       PERFILES DISPONIBLES PARA ASIGNAR
    ========================================================== */

    #contenedor_asignar_perfiles {
        width: 100%;

        margin-top: 35px;
        padding-top: 25px;

        border-top: 1px solid #ddd;

        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
    }


    /* ==========================================================
       TARJETA DE PERFIL DISPONIBLE
    ========================================================== */

    .perfil_disponible {
        width: 100%;

        padding: 20px;

        border: 1px solid #ddd;
        border-radius: 10px;

        box-sizing: border-box;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .perfil_disponible .campo_perfil {
        width: 100%;

        display: flex;
        flex-direction: column;
        gap: 6px;
    }


    /* ==========================================================
       BOTÓN ASIGNAR
    ========================================================== */

    .btn_asignar_perfil {
        width: 100%;
        height: 40px;

        border: none;
        border-radius: 6px;

        cursor: pointer;

        font-weight: bold;
        font-size: 14px;
    }


    /* ==========================================================
       BOTÓN ACTUALIZAR
    ========================================================== */

    #formulario_actualizar>input[type="submit"] {
        width: 100%;
        max-width: 300px;

        height: 45px;

        margin: 30px auto 0;

        border: none;
        border-radius: 7px;

        cursor: pointer;

        font-size: 15px;
        font-weight: bold;
    }


    /* ==========================================================
       MENSAJE SIN PERFILES
    ========================================================== */

    .mensaje_sin_perfiles {
        grid-column: 1 / -1;

        width: 100%;

        padding: 20px;

        text-align: center;

        border: 1px dashed #ccc;
        border-radius: 8px;

        box-sizing: border-box;
    }


    /* ==========================================================
       TABLET
    ========================================================== */

    @media (max-width: 800px) {

        #contenedor_perfiles_asignado,
        #contenedor_asignar_perfiles {
            grid-template-columns: 1fr;
        }

        .contenedor_visualizar_registrado {
            padding: 25px;
        }
    }


    /* ==========================================================
       TELÉFONO
    ========================================================== */

    @media (max-width: 500px) {

        #modulo_visualizar_personal_registrado {
            padding: 20px 10px;
        }

        .contenedor_visualizar_registrado {
            padding: 20px 15px;
        }

        .contenedor_busqueda_personal {
            padding: 18px;
        }

        .perfil_asignado {
            grid-template-columns: 1fr;
        }

        .perfil_asignado .campo_perfil:first-child {
            grid-column: auto;
        }
    }
</style>

<section id="modulo_visualizar_personal_registrado">
    <div class="contenedor_visualizar_registrado">
        <h2>Actualizar Perfil(es) del Personal</h2>

        <div class="contenedor_busqueda_personal">
            <form method="post" id="formulario_busqueda">
                {% csrf_token %}

                <label for="cedula_identidad">Cédula de Identidad:</label>
                <div class="grupo-cedula">
                    <select name="nacionalidad_registrar" id="nacionalidad" required>
                        <option value="">N</option>
                        <option value="V">V</option>
                        <option value="E">E</option>
                    </select>
                    <input type="text" name="cedula_registrar" id="cedula_identidad" autocomplete="off" required>
                </div>

                <input type="submit" value="Buscar Usuario">
            </form>
        </div>


        <div class="contenedor_actualizar_perfil">
            <form method="post" id="formulario_actualizar">
                {% csrf_token %}

                <label for="nombres_usuario">Nombres:</label>
                <input type="text" name="nombres_usuario" id="nombres_usuario" readonly>

                <label for="apellidos_usuario">Apellidos:</label>
                <input type="text" name="apellidos_usuario" id="apellidos_usuario" readonly>

                <label for="cedula_usuario">Cedula Identidad:</label>
                <input type="text" name="cedula_usuario" id="cedula_usuario" readonly>

                <div id="contenedor_perfiles_asignado"></div>

                <div id="contenedor_asignar_perfiles"></div>

                <input type="submit" value="Actualizar Perfiles">
            </form>
        </div>
    </div>
</section>

<script
    src="{% static 'Funciones_Asincronas/Director_General/pre_registro/actualizar_personal_registrado.js' %}"></script>
<script src="{% static 'Funcionalidades/cedula_identidad.js' %}"></script>

{% endblock %}
