{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_materias">
    <div class="contenedor_modulo_materias">
        <h2>Materias UPT "José Félix Ribas"</h2>

        <h3>Buscar Materia</h3>

        <form method="post" id="buscar_materia">
            {% csrf_token %}

            <label for="codigos_buscar_materias">Código del Materia:</label>
            <input type="text" name="codigo" id="codigos_buscar_materias" minlength="7" maxlength="7" pattern="[A-Z]{4}[0-9]{3}" title="Debe contener 4 letras mayúsculas y 3 números. Ejemplo: MATE001" placeholder="Escribir el código de la materia" autocomplete="off" required>

            <input type="submit" value="Buscar Materia">
        </form>


        <h3>Actuailizar Materias</h3>

        <form method="post" id="actualizar_materia">
            {% csrf_token %}
            <input type="hidden" name="materiaseleccionado" id="materia_seleccionado">

            <label for="nombres_actualizar_materias">Nombre de la Materia:</label>
            <input type="text" name="nombresmaterias" id="nombres_actualizar_materias" autocomplete="off" required>

            <label for="reparacion_actualizar_materia">Reparación Materia:</label>
            <select name="reparacionmateria" id="reparacion_actualizar_materia">
                <option value="Si">Si</option>
                <option value="No">No</option>
            </select> 
            
            <label for="pnfs_actualizar_materia">P.N.F que Pertenece la Materia:</label>
            <select name="pnfmateria" id="pnfs_actualizar_materia"></select> 

            <input type="submit" id="btn_registrar" value="Actualizar Materia">
        </form>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Director_General/Materia/actualizar_materia.js' %}"></script>

{% endblock %}
