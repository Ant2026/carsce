{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_autoridades_reasignar">
    <div class="contenedor_modulo_autoridades">
        <h3>Gestión de Autoridades</h3>

        <div class="card_reasignar_autoridades">
            <h4>Reasignar Cargos</h4>

            <form method="post" id="formulario_actualizar">
                {% csrf_token %}

                <!-- ENVOLTORIO RESPONSIVE PARA TABLA DE EDICIÓN -->
                <div class="contenedor_tabla">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Cédula</th>
                                <th>Cargo Actual</th>
                                <th>Nuevo Cargo</th>
                            </tr>
                        </thead>
                        <tbody id="contenedor_autoridades">
                            <!-- Filas con opciones de reasignación renderizadas por JS -->
                        </tbody>
                    </table>
                </div>

                <div class="contenedor_acciones">
                    <input type="submit" id="btn_reasignar" value="Reasignar Cargos">
                </div>
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Director_General/Autoridad/reasignar_cargo.js' %}"></script>

{% endblock %}
