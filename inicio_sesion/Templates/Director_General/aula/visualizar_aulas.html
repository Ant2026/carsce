{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_aulas_visualizar">
    <div class="contenedor_aulas_academicas">
        <h3>Aulas Académicas</h3>

        <div class="card_visualizar_aulas">
            <h4>Búsqueda de Aulas Académicas</h4>

            <!-- ENVOLTORIO RESPONSIVE PARA TABLA -->
            <div class="contenedor_tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Aula</th>
                            <th>Edificio</th>
                            <th>Piso</th>
                        </tr>
                    </thead>
                    <tbody id="contenedor_aulas">
                        <!-- Filas de aulas cargadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- MODAL DE EDICIÓN (DIALOG) -->
<dialog id="dialogo_actualizar_aula">
    <div class="contenedor_actualizar_aula">
        <i id="cerrar_dialogo" class="icon-cancel-circled" title="Cerrar"></i>
        <h4>Actualizar Aula Académica</h4>

        <div id="mensajede_error"></div>

        <form method="post" id="formulario_actualizar_aula">
            {% csrf_token %}
            <input type="hidden" name="aulaseleccionar" id="aula_seleccionar">

            <!-- FILA 1: Nombre del Aula -->
            <div class="campo">
                <label for="actualizar_nombre_aula">Nombre / Número del Aula:</label>
                <input type="text" name="actualizar_aula" id="actualizar_nombre_aula" autocomplete="off" required>
            </div>

            <!-- FILA 2: Edificio y Piso -->
            <div class="fila-campos">
                <div class="campo">
                    <label for="actualizar_nombre_edificio">Nombre del Edificio:</label>
                    <input type="text" name="actualizar_edificio" id="actualizar_nombre_edificio" autocomplete="off" required>
                </div>

                <div class="campo">
                    <label for="actualizar_piso_edificio">Piso del Edificio:</label>
                    <input type="text" name="actualizar_piso" id="actualizar_piso_edificio" autocomplete="off" required>
                </div>
            </div>

            <input type="submit" id="btn_actualizar_aula" value="Actualizar Aula">
        </form> 
    </div>
</dialog>

<script src="{% static 'Funciones_Asincronas/Director_General/Aula/visualizar_aula.js' %}"></script>

{% endblock %}
