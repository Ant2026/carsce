{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_aulas_registrar">
    <div class="contenedor_aulas_academicas">
        <h3>Aulas Académicas</h3>

        <div class="card_registrar_aulas">
            <h4>Registrar Aulas Académicas</h4>

            <form method="post" id="formulario_registrar">
                {% csrf_token %}

                <!-- FILA 1: Nombre / Número del Aula -->
                <div class="fila-campos">
                    <div class="campo campo-completo">
                        <label for="registrar_nombre_aula">Nombre / Número del Aula:</label>
                        <input type="text" name="registrar_aula" id="registrar_nombre_aula" placeholder="Máximo 20 caracteres" maxlength="20" autocomplete="off" required>
                        <small id="mensaje_nombre_aula"></small>
                    </div>
                </div>

                <!-- FILA 2: Edificio y Piso -->
                <div class="fila-campos">
                    <div class="campo">
                        <label for="registrar_nombre_edificio">Nombre del Edificio:</label>
                        <input type="text" name="registrar_edificio" id="registrar_nombre_edificio" placeholder="Máximo 20 caracteres" maxlength="20" autocomplete="off" required>
                    </div>

                    <div class="campo">
                        <label for="registrar_piso_edificio">Piso del Edificio:</label>
                        <input type="text" name="registrar_piso" id="registrar_piso_edificio" placeholder="Máximo 20 caracteres" maxlength="20" autocomplete="off" required>
                    </div>
                </div>

                <input type="submit" id="btn_registrar" value="Registrar Aula">
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Director_General/Aula/registrar_aula.js' %}"></script>

{% endblock %}
