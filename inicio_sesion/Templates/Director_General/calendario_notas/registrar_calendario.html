{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_calendario">
    <div class="contenedor_modulo_calendario">
        <h3>Calendario Notas Académicas <br>UPT "José Félix Ribas"</h3>

        <div class="contenedor_registrar_calendario">
            <h4>Registrar Calendario Notas Académicas</h4>

            <form method="post" id="registrar_calendario">
                {% csrf_token %}

                <!-- FILA 1: Inicial Trimestral e Inicial Semestral -->
                <div class="fila-campos">
                    <div class="campo">
                        <label for="fecha_Inicial_Trimestral">Inicial Trimestral:</label>
                        <input type="date" name="fechainicialtrimestral" id="fecha_Inicial_Trimestral">
                    </div>

                    <div class="campo">
                        <label for="fecha_Inicial_Semestral">Inicial Semestral:</label>
                        <input type="date" name="fechainicialsemestral" id="fecha_Inicial_Semestral">
                    </div>
                </div>

                <!-- FILA 2: Tramos I y II -->
                <div class="fila-campos">
                    <div class="campo">
                        <label for="fecha_TramoI">Tramo I:</label>
                        <input type="date" name="fechatramoI" id="fecha_TramoI">
                    </div>

                    <div class="campo">
                        <label for="fecha_TramoII">Tramo II:</label>
                        <input type="date" name="fechatramoII" id="fecha_TramoII">
                    </div>
                </div>

                <!-- FILA 3: Tramo III y Reparación -->
                <div class="fila-campos">
                    <div class="campo">
                        <label for="fecha_TramoIII">Tramo III:</label>
                        <input type="date" name="fechatramoIII" id="fecha_TramoIII">
                    </div>

                    <div class="campo">
                        <label for="fecha_Reparacion">Reparación:</label>
                        <input type="date" name="fechareparacion" id="fecha_Reparacion">
                    </div>
                </div>

                <!-- FILA 4: Semestres I y II -->
                <div class="fila-campos">
                    <div class="campo">
                        <label for="fecha_SemestreI">Semestre I:</label>
                        <input type="date" name="fechasemestreI" id="fecha_SemestreI">
                    </div>

                    <div class="campo">
                        <label for="fecha_SemestreII">Semestre II:</label>
                        <input type="date" name="fechasemestreII" id="fecha_SemestreII">
                    </div>
                </div>

                <input type="submit" id="btn_registro" value="Registrar Calendario Académico">
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Director_General/Calendario_Notas/registrar_calendario.js' %}"></script>

{% endblock %}
