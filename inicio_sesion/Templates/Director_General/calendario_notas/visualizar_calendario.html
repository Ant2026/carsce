{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_calendario">
    <div class="contenedor_modulo_calendario">
        <h3>Calendario Notas Académicas UPT "José Félix Ribas""</h3>

        <h4>Vista de Calendario Notas</h4>

        <table>
            <thead>
                <tr>
                    <th>Periodo Académico</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Final</th>
                </tr>
            </thead>
            <tbody id="contenedor_registrado"></tbody>
        </table>
    </div>
</section>

<dialog id="dialogo_actualizar_calendario">
    <div class="contenedor_actualizar_calendario">
        <i id="cerrar_dialogo" class="icon-cancel-circled"></i>
        <h4>Actualizar Calendario Académico</h4>

        <form method="post" id="actualizar_calendario">
            {% csrf_token %}
            <input type="hidden" name="fechaseleccionado" id="fecha_seleccionado">

            <label for="select_periodo_academico">Periodo Académico:</label>
            <select name="actualizar_fecha_academica" id="select_periodo_academico"></select>

            <label for="fecha_inicial_academica">Fecha Académica (Inicial):</label>
            <input type="date" name="nueva_fecha" id="fecha_inicial_academica">

            <label for="fecha_final_academica">Fecha Académica (Final):</label>
            <input type="date" id="fecha_final_academica" readonly>

            <input type="submit" value="Actualizar Fecha">
        </form>
    </div>
</dialog>

<script src="{% static 'Funciones_Asincronas/Director_General/Calendario_Notas/visualizar_calendario.js' %}"></script>

{% endblock %}
