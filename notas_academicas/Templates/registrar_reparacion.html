{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_registrar_reparacion">
    <div class="contenedor_registrar_reparacion">
        <h2>Registrar Reparación</h2>

        <form method="post" id="formulario_registrar">
            {% csrf_token %}
            <label for="nucleo_asignado">Núcleo Asignado:</label>
            <select name="nucleo_asignado" id="nucleo_asignado"></select>

            <label for="pnf_asignado">P.N.F Asignado:</label>
            <select name="pnf_asignado" id="pnf_asignado"></select>

            <label for="materia_asignada">Materia(s) Asignada(s):</label>
            <select name="materia_asignada" id="materia_asignada"></select>

            <label for="trayecto_academico">Trayecto:</label>
            <select name="trayecto_academico" id="trayecto_academico"></select>

            <div class="contenedor_boton_notas">
                <input type="submit" value="Registrar">
            </div>

            <div id="contenedor_evaluaciones"></div>
        </form>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/registrar_reparacion.js' %}"></script>

{% endblock %}
